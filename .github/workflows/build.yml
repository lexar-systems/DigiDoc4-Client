name: CI
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
env:
  BUILD_NUMBER: ${{ github.run_number }}
  CMAKE_BUILD_PARALLEL_LEVEL: 4
jobs:
  macos:
    name: Build on macOS
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: 14.0
      LIBS_PATH: ${{ github.workspace }}/cache
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        submodules: recursive
    - name: Download artifact
      uses: dawidd6/action-download-artifact@v27
      with:
        workflow: build.yml
        branch: master
        name: macos
        path: libdigidocpp-pkg
        repo: open-eid/libdigidocpp
    - name: Install dependencies
      run: |
        brew install flatbuffers
        curl -O -L -s https://installer.id.ee/media/github/opensc_0.27.1-3.pkg
        sudo installer -verboseR -pkg libdigidocpp-pkg/build/macos/libdigidocpp*.pkg -target /
        sudo installer -verboseR -pkg opensc_*.pkg -target /
        rm -rf libdigidocpp-pkg
    - name: Cache libraries
      uses: actions/cache@v6
      with:
        path: ${{ env.LIBS_PATH }}
        key: vcpkg-macOS-${{ hashFiles('prepare_osx_build_environment.sh') }}
    - name: Build libraries
      run: |
        mkdir -p ${LIBS_PATH}/Qt-6.12.0-OpenSSL
        ./prepare_osx_build_environment.sh -p ${LIBS_PATH}
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: 6.12.0
        arch: clang_64
        cache: true
    - name: Build
      run: |
        cmake "-GNinja" -B build -S . -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DOPENSSL_ROOT_DIR=${LIBS_PATH}/OpenSSL \
          -DLDAP_ROOT=${LIBS_PATH}/OpenLDAP \
          -DCMAKE_CXX_FLAGS="-I/Library/Frameworks/digidocpp.framework/Headers" \
          -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"
        cmake --build build
        cmake --build build --target macdeployqt
        codesign --force --deep --sign - build/client/qdigidoc4.app
        cmake --build build --target zip
    - name: Archive artifacts
      uses: actions/upload-artifact@v7
      with:
        name: macOS
        path: build/qdigidoc4*.zip
        retention-days: 7   
